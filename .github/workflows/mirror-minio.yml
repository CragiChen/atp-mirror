# =============================================================================
# T-S0-03b：把 Docker Hub 的 MinIO 镜像中转进 GHCR
#
# 背景（T-S0-03-REC §13.9）：
#   * 本机与内网中转机都在受限出口，registry-1.docker.io:443 被 TCP 层阻断；
#   * 国内公共镜像站只缓存 library/*，minio/minio 命名空间 403/404；
#   * 但 **ghcr.io 在本机可达**（匿名 token 200 + 公开镜像 manifest 200 ✓）。
#
# 做法：GitHub Actions 的 runner 有境外出口，直接 pull arm64 镜像再 push 到 GHCR。
#   （初版用 buildx imagetools create 复制 manifest list，实跑失败；
#     改为真正把层推上去，最可靠且本机只需 arm64 ✓）
#   失败时把错误写进 ::error:: annotation —— 公开仓库的 annotations 可匿名读，
#   这样本机无需 API token 也能看到失败原因 ✓。
#
# ⚠️ 使用前必做：把推送出来的 GHCR package 的可见性设为 **Public**，
#    否则本机匿名 pull 会 401（GITHUB_TOKEN 推送的包默认是 private）。
#    https://github.com/users/<OWNER>/packages/container/minio/settings
#
# 触发方式：① workflow 文件被 push 时自动跑一次；② 也可在 Actions 页手动 Run。
# 目标仓库建议是**新建的空公开仓库**：GHCR package 默认继承仓库可见性，
# 公开仓库推出来的包才能被本机匿名 pull ✓。
#
# 本仓库**只需这一个文件**：期望 tag 直接写在下面的 EXPECTED_TAG 常量里，
# 不复制主仓库的 docker-compose.yml —— 那个文件含 ${VAR:-默认口令} 形态的
# 开发默认值，推到公开仓库会暴露凭据 ✓。
# tag 一致性由本机侧确认：主仓库 docker-compose.yml 里的 tag 必须等于 EXPECTED_TAG。
# =============================================================================
name: mirror-minio-to-ghcr

on:
  # 首次把本文件推到**新建的空公开仓库**时自动跑一次 ——
  # 这样不需要额外的 API token 去触发 workflow_dispatch。
  # 之后只有本文件变更才会再跑，不会因普通提交反复推镜像。
  push:
    paths:
      - '.github/workflows/mirror-minio.yml'
  workflow_dispatch:
    inputs:
      minio_tag:
        description: 'MinIO 镜像 tag（必须与 docker-compose.yml 一致）'
        required: true
        default: 'RELEASE.2024-10-13T13-34-11Z'

permissions:
  contents: read
  packages: write

env:
  SRC: docker.io/minio/minio
  DST_NAME: minio
  # 必须与主仓库 docker-compose.yml 里 minio/minio 的 tag 一致
  EXPECTED_TAG: RELEASE.2024-10-13T13-34-11Z

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      # push 触发时 inputs 为空，必须给默认值，否则 tag 会是空串（实测设计缺陷）
      - name: 解析 tag（兼容 push / 手动两种触发）
        run: |
          TAG="${{ inputs.minio_tag || env.EXPECTED_TAG }}"
          echo "MINIO_TAG=$TAG" >> "$GITHUB_ENV"
          echo "本次中转 tag: $TAG"
          echo "期望 tag（与主仓库 compose 对齐）: ${{ env.EXPECTED_TAG }}"
          [ "$TAG" = "${{ env.EXPECTED_TAG }}" ] \
            || { echo "::error::传入 tag 与 EXPECTED_TAG 不一致，别中转一个用不上的版本"; exit 1; }

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 诊断 Docker Hub 源镜像（区分仓库不存在 / tag 被删 / 限流）
        run: |
          set +e   # 诊断步本身失败不应中断 job，结果仍写进 annotation
          TOK="$(curl -sS 'https://auth.docker.io/token?service=registry.docker.io&scope=repository:minio/minio:pull' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin).get("token",""))')"
          CODE="$(curl -sS -o /tmp/m.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOK" \
            -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.index.v1+json' \
            "https://registry-1.docker.io/v2/minio/minio/manifests/$MINIO_TAG")"
          echo "::notice::manifest 状态=$CODE 响应=$(head -c 180 /tmp/m.json | tr '\n' ' ')"
          TL="$(curl -sS -o /tmp/t.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOK" \
            'https://registry-1.docker.io/v2/minio/minio/tags/list?n=100')"
          echo "::notice::tags/list 状态=$TL 样例=$(python3 -c 'import json;print(", ".join(json.load(open("/tmp/t.json")).get("tags",[])[-6:]))' 2>/dev/null | head -c 180)"

      - name: 拉取 arm64 镜像并推送到 GHCR
        id: copy
        run: |
          SRC="${{ env.SRC }}:$MINIO_TAG"
          DST="ghcr.io/${{ github.repository_owner }}/${{ env.DST_NAME }}:$MINIO_TAG"
          echo "源: $SRC"
          echo "目标: $DST"
          fail() { MSG="${1//$'\n'/%0A}"; echo "::error::${MSG:0:900}"; echo "$1"; exit 1; }
          OUT="$(docker pull --platform linux/arm64 "$SRC" 2>&1)" || fail "docker pull 失败: $OUT"
          echo "$OUT"
          docker tag "$SRC" "$DST"
          OUT="$(docker push "$DST" 2>&1)" || fail "docker push 失败: $OUT"
          echo "$OUT"
          echo "dst=$DST" >> "$GITHUB_OUTPUT"

      - name: 输出 digest 供本机校验
        run: |
          DST="${{ steps.copy.outputs.dst }}"
          DIGEST="$(docker buildx imagetools inspect "$DST" 2>/dev/null | grep -m1 '^Digest:' | awk '{print $2}' || true)"
          {
            echo "## 中转完成"
            echo ""
            echo "- 目标镜像：\`$DST\`"
            echo "- manifest digest：\`${DIGEST:-（用 docker buildx imagetools inspect 查看）}\`"
            echo ""
            echo "### 本机侧"
            echo '```bash'
            echo "OWNER=${{ github.repository_owner }}"
            echo "TAG=$MINIO_TAG"
            echo 'docker pull --platform linux/arm64 ghcr.io/$OWNER/minio:$TAG'
            echo 'docker tag ghcr.io/$OWNER/minio:$TAG docker.m.daocloud.io/minio/minio:$TAG'
            echo 'docker compose --env-file deploy/.env up -d'
            echo '```'
            echo ""
            echo "> 记得先把 GHCR package 可见性设为 **Public**。"
          } >> "$GITHUB_STEP_SUMMARY"
